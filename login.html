<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FriendsSoft Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f7fb}.card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:30px;box-shadow:0 15px 50px #0001}.brand{text-align:center;font-size:28px;font-weight:800;margin-bottom:8px}.sub{text-align:center;color:#667085;margin-bottom:25px}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#1769e0;color:white;font-size:16px;font-weight:700;cursor:pointer}.msg{margin-top:14px;text-align:center;color:#d92d20;min-height:20px}.hint{text-align:center;color:#98a2b3;font-size:12px;margin-top:20px}</style></head><body><div class="card"><div class="brand">FRIENDSSOFT</div><div class="sub">School Management System</div><form id="f"><label>School Code / Username</label><input id="login" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Login</button></form><div id="msg" class="msg"></div><div class="hint">Secure online school access</div></div><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login.value,password:password.value})});const d=await r.json();if(!r.ok||!d.status)throw new Error(d.message||'Login failed');location.href='/app';}catch(x){msg.textContent=x.message;}}</script></body></html>
